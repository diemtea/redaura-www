<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gap schematic — standalone</title>
<script src="./ds-base.js"></script>
<script src="./i18n.js"></script>
<style>
/* ============================================================
   ALERT-ROUTE SCHEMATIC — standalone extract
   Route: [Team box] —Release→ [■ Hub] —<60s→ [broadcast dot field]
                                  └→ [Monitoring box]
   Behavior:
   1. Draws itself in, in sequence, when scrolled into view (IntersectionObserver).
   2. Then loops forever on a 7s cycle: a red packet runs the route,
      the hub beats, the dot field lights in a radial wave behind two
      expanding rings, the monitoring box flashes on arrival.
   
   Timing map for retuning:
   - Reveal stagger: transition-delays (0–1.7s)
     - b1 (Team box): 0s
     - l1 (Release line): 0.25s, label: 0.55s
     - gd-hub (Redaura): 0.6s
     - l2 (<60s line): 0.85s, label: 1.15s
     - b2 (Dot field): 1.2s
     - gd-drop (Vertical v line): 1.5s
     - b3 (Monitoring box): 1.7s
   - Signal loop: 7s keyframe cycle
     - Packet 1 leaves b1: 2.6s
     - Packet 2 leaves hub: 3.8s
     - Monitoring flash (b3): 4.6s (peaks ≈5.6s)
     - Field wave (dots + ripple 1): 4.7s + --d
     - Ripple 2: 4.9s
     - Vertical drop packet: 5.0s

   Notes for integration:
   - Map the 5 custom properties below to your app's tokens.
   - All positions use logical properties → mirrors automatically under dir="rtl".
   - Honors prefers-reduced-motion (static, field pre-lit).
   - Mobile (≤720px) stacks vertically; packets are disabled there.
   ============================================================ */
:root {
  --gd-bg: var(--color-bg, #f3f2f2);        /* page background */
  --gd-ink: var(--color-text, #201e1d);       /* text / lines */
  --gd-accent: var(--color-accent, #ec3013);    /* the one red */
  --gd-accent-deep: var(--color-accent-700, #a02008); /* accent, dark enough for small text */
  --gd-dot: var(--color-neutral-400, #b9b5b3);       /* idle dot color */
}
body { margin: 0; background: var(--gd-bg); color: var(--gd-ink); padding: 80vh 40px 60vh; } /* padding only so you can scroll to trigger it */

.gap-dia {
  display: grid;
  grid-template-columns: minmax(160px, 200px) minmax(24px, 40px) minmax(130px, 170px);
  align-items: center;
  gap: 0;
  max-width: 440px;
  width: 100%;
}
.gap-dia .b1 { grid-column: 1; grid-row: 1; }
.gap-dia .l1 { grid-column: 1; grid-row: 2; justify-self: center; }
.gap-dia .gd-hub { grid-column: 1; grid-row: 3; justify-self: center; display: flex; align-items: center; gap: 8px; padding: 4px 0; position: relative; }
.gap-dia .gd-line-h { grid-column: 2; grid-row: 3; position: relative; height: 2px; background: var(--gd-ink); width: 100%; }
.gap-dia .gd-line-h::after { content: ""; position: absolute; top: -3px; left: 0; width: 8px; height: 8px; background: var(--gd-accent); opacity: 0; }
[dir='rtl'] .gap-dia .gd-line-h::after { left: auto; right: 0; }
.gap-dia .b3 { grid-column: 3; grid-row: 3; align-self: center; }
.gap-dia .l2 { grid-column: 1; grid-row: 4; }
.gap-dia .b2 { grid-column: 1; grid-row: 5; width: 100%; display: flex; flex-direction: column; gap: 0; }

.gd-box { position: relative; border: 2px solid var(--gd-ink); padding: 10px 14px 11px; background: var(--gd-bg); width: 100%; box-sizing: border-box; z-index: 2; }
.gd-box .t { font-weight: 700; font-size: 13px; line-height: 17px; margin: 0; }
.gd-box .s { font-size: 10px; line-height: 13px; letter-spacing: 0.07em; text-transform: uppercase;
  color: color-mix(in srgb, var(--gd-ink) 62%, transparent); margin: 3px 0 0; }
.gd-line { position: relative; width: 2px; height: 48px; min-width: 0; background: var(--gd-ink); }
.gd-line::after { content: ""; position: absolute; top: 0; inset-inline-start: -3px; width: 8px; height: 8px;
  background: var(--gd-accent); opacity: 0; }
.gd-hub .sq { width: 16px; height: 16px; flex-shrink: 0; display: block; position: relative; z-index: 2; }
.gd-hub .t { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; position: relative; z-index: 2; }

/* Pulse rings emanating directly from Redaura logo icon */
.gd-hub .rip {
  position: absolute;
  left: 8px;
  top: 50%;
  width: 16px;
  height: 16px;
  margin: 0;
  border: 2px solid var(--gd-accent);
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 1;
}

/* Geofenced Zone Container */
.gd-zone {
  position: relative;
  width: 100%;
  border: 1.5px dashed color-mix(in srgb, var(--gd-accent) 65%, var(--gd-ink));
  background: color-mix(in srgb, var(--gd-accent) 4.5%, var(--gd-bg));
  box-shadow: 0 0 16px color-mix(in srgb, var(--gd-accent) 10%, transparent), inset 0 0 30px color-mix(in srgb, var(--gd-accent) 3.5%, transparent);
  margin-top: -2px;
  padding: 16px 10px 10px;
  box-sizing: border-box;
  z-index: 1;
}
.gd-fence-tag {
  position: absolute;
  left: 10px;
  bottom: 6px;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--gd-accent-deep);
  opacity: 0.8;
  pointer-events: none;
  font-feature-settings: "tnum" 1;
}

/* Expanded dot field with uniform 5px dots and random/variant spatial distribution */
.gd-field { position: relative; width: 100%; height: 210px; margin-block: 4px 6px; }
.gd-field i {
  position: absolute;
  inset-inline-start: var(--x);
  top: var(--y);
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gd-dot);
  transform: translate(-50%, -50%);
}

.gap-dia.pre .gd-box, .gap-dia.pre .gd-hub, .gap-dia.pre .gd-field, .gap-dia.pre .gd-zone { opacity: 0; transform: translateY(8px); }
.gap-dia.pre .gd-line { transform: scaleY(0); transform-origin: top; }
.gap-dia.pre .gd-line-h { transform: scaleX(0); transform-origin: 0 50%; }
[dir='rtl'] .gap-dia.pre .gd-line-h { transform-origin: 100% 50%; }
.gap-dia .gd-box, .gap-dia .gd-hub, .gap-dia .gd-field, .gap-dia .gd-zone, .gap-dia .gd-line, .gap-dia .gd-line-h {
  transition: opacity 0.45s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
.gap-dia.play .gd-box, .gap-dia.play .gd-hub, .gap-dia.play .gd-field, .gap-dia.play .gd-zone, .gap-dia.play .gd-line,
.gap-dia.play .gd-line-h { opacity: 1; transform: none; }
.gap-dia.play .b1 { transition-delay: 0s; }
.gap-dia.play .l1 { transition-delay: 0.25s; }
.gap-dia.play .gd-hub { transition-delay: 0.6s; }
.gap-dia.play .gd-line-h { transition-delay: 0.75s; }
.gap-dia.play .b3 { transition-delay: 0.9s; }
.gap-dia.play .l2 { transition-delay: 1.15s; }
.gap-dia.play .b2 { transition-delay: 1.5s; }

/* 7s Signal Loop Animations — fully in sync with packet arrival at 3.16s */
.gap-dia.play .l1::after { animation: gd-pkv 7s linear 2.6s infinite; }
.gap-dia.play .gd-hub .sq { animation: gd-beat 7s ease 3.16s infinite; }
.gap-dia.play .gd-hub .rip { animation: gd-rip 7s ease-out 3.16s infinite; }
.gap-dia.play .gd-hub .rip.r2 { animation: gd-rip 7s ease-out 3.35s infinite; }
.gap-dia.play .l2::after { animation: gd-pkv 7s linear 3.16s infinite; }
.gap-dia.play .gd-line-h::after { animation: gd-pkh-right 7s linear 3.16s infinite; }
.gap-dia.play .b3 { animation: gd-flash 7s ease 3.9s infinite; }
.gap-dia.play .b2 .gd-box { animation: gd-flash 7s ease 3.72s infinite; }
.gap-dia.play .gd-field i { animation: gd-dot 7s ease calc(3.72s + var(--d)) infinite; }

@keyframes gd-pkv {
  0% { top: 0; opacity: 0; }
  1.5% { opacity: 1; }
  8% { top: calc(100% - 8px); opacity: 1; }
  10% { opacity: 0; }
  100% { top: calc(100% - 8px); opacity: 0; }
}
@keyframes gd-pkh-right {
  0% { left: 0; opacity: 0; }
  1.5% { opacity: 1; }
  10% { left: calc(100% - 8px); opacity: 1; }
  12% { opacity: 0; }
  100% { left: calc(100% - 8px); opacity: 0; }
}
@keyframes gd-beat {
  0%, 12%, 100% { transform: none; }
  4% { transform: scale(1.4); }
}
@keyframes gd-flash {
  0%, 10%, 100% { background-color: var(--gd-bg); }
  3% { background-color: color-mix(in srgb, var(--gd-accent) 15%, var(--gd-bg)); }
}
@keyframes gd-dot {
  0%, 100% { background: var(--gd-dot); opacity: var(--o, 0.85); transform: translate(-50%, -50%); }
  2% { background: var(--gd-accent); opacity: 1; transform: translate(-50%, -50%) scale(2.2); }
  6% { background: var(--gd-ink); opacity: 1; transform: translate(-50%, -50%); }
  80% { background: var(--gd-ink); opacity: var(--o, 0.85); }
  90% { background: var(--gd-dot); opacity: var(--o, 0.85); }
}
@keyframes gd-rip {
  0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.85; }
  12% { transform: translate(-50%, -50%) scale(14); opacity: 0; }
  100% { transform: translate(-50%, -50%) scale(14); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .gap-dia.pre .gd-box, .gap-dia.pre .gd-hub, .gap-dia.pre .gd-field, .gap-dia.pre .gd-zone, .gap-dia.pre .gd-line-h { opacity: 1; transform: none; }
  .gap-dia.pre .gd-line, .gap-dia.pre .gd-line-h { transform: none; }
  .gap-dia.play .l1::after, .gap-dia.play .l2::after, .gap-dia.play .gd-line-h::after,
  .gap-dia.play .gd-hub .sq, .gap-dia.play .b3,
  .gap-dia.play .gd-field i, .gap-dia.play .gd-hub .rip { animation: none; }
  .gap-dia .gd-field i { background: var(--gd-ink); }
}
</style>
</head>
<body>
<p style="opacity:0.5">scroll down ↓</p>

<!-- ===== MARKUP: the whole component ===== -->
<div class="gap-dia">
  <div class="gd-box b1"><p class="t" data-i18n="dia.team">Drug-checking team</p><p class="s" data-i18n="dia.teamSub">Verified on-site detection</p></div>

<!-- ===== JS: scroll trigger (the only script needed) ===== -->
<script>
(() => {
  const dia = document.querySelector('.gap-dia');
  if (!dia || !('IntersectionObserver' in window)) return;
  dia.classList.add('pre');
  const io = new IntersectionObserver((es) => {
    if (es[0].isIntersecting) { dia.classList.add('play'); io.disconnect(); }
  }, { threshold: 0.4 });
  io.observe(dia);
})();
</script>
